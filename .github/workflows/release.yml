name: Release
on:
  push:
    tags:
      - '[0-9]*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const manifest = read('manifest.json');
          const lock = read('package-lock.json');
          const expected = process.env.RELEASE_TAG;
          const versions = {
            'manifest.json': manifest.version,
            'package.json': read('package.json').version,
            'package-lock.json': lock.version,
            'package-lock.json packages[""]': lock.packages?.['']?.version,
          };
          const errors = Object.entries(versions)
            .filter(([, version]) => version !== expected)
            .map(([file, version]) => `${file}: expected tag ${expected}, got ${version}`);
          const compatibility = read('versions.json')[manifest.version];
          if (compatibility !== manifest.minAppVersion) {
            errors.push(`versions.json[${manifest.version}]: expected ${manifest.minAppVersion}, got ${compatibility}`);
          }
          if (errors.length) throw new Error(errors.join('\n'));
          JS
      - run: npm ci
      - run: npm run check
      - name: Publish release with Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --verify-tag --title "Rast $RELEASE_TAG" --generate-notes
